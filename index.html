<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Паспорт оборудования</title>
<style>
  :root{color-scheme: light dark;}
  body{font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; padding:20px; background:#f4f6f9; color:#1f2937;}
  h1{font-size:20px;margin:0 0 16px;}
  h2{font-size:16px;margin:20px 0 8px;}
  .equipment-name{font-size:24px;font-weight:700;margin:0 0 16px;}
  .equipment-photo{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:0 0 16px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:14px;word-break:break-word;}
  th{color:#6b7280;font-weight:600;width:40%;}
  tr:last-child th,tr:last-child td{border-bottom:none;}
  p{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);white-space:pre-wrap;}
  .error{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px;}
  @media (prefers-color-scheme: dark){
    body{background:#111827;color:#e5e7eb;}
    table,p{background:#1f2937;box-shadow:none;}
    th,td{border-bottom-color:#374151;}
  }
</style>
</head>
<body>
<h1>Паспорт оборудования</h1>
<div id="content"></div>
<script>
function b64urlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

const RESERVED_KEYS = ['наименование', 'примечания', 'доп. информация', 'фото', 'фото_url'];

function photoSrc(photo){
  if(/^data:/.test(photo) || /^https?:/.test(photo)) return photo;
  return 'data:image/jpeg;base64,' + photo;
}

function render(data){
  const content = document.getElementById('content');
  let out = '';
  const photo = data['фото_url'] || data['фото'];
  if(photo){
    out += '<img class="equipment-photo" src="'+escapeHtml(photoSrc(photo))+'" alt="Фото оборудования">';
  }
  if(data['наименование']){
    out += '<div class="equipment-name">'+escapeHtml(data['наименование'])+'</div>';
  }
  out += '<table>';
  for(const key in data){
    if(RESERVED_KEYS.includes(key)) continue;
    out += '<tr><th>'+escapeHtml(key)+'</th><td>'+escapeHtml(data[key])+'</td></tr>';
  }
  out += '</table>';
  if(Array.isArray(data['доп. информация'])){
    out += '<h2>Доп. информация</h2>';
    for(const item of data['доп. информация']){
      out += '<p>'+escapeHtml(item)+'</p>';
    }
  }
  if(data['примечания']){
    out += '<h2>Примечания</h2><p>'+escapeHtml(data['примечания']).replace(/\n/g,'<br>')+'</p>';
  }
  content.innerHTML = out;
}

try{
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('data');
  if(!raw) throw new Error('Нет данных в ссылке');
  const json = b64urlDecode(raw);
  const data = JSON.parse(json);
  render(data);
}catch(e){
  document.getElementById('content').innerHTML = '<div class="error">Не удалось прочитать данные: '+escapeHtml(e.message)+'</div>';
}
</script>
</body>
</html>
